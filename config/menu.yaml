# LPQ_VISION - menu.yaml (the sealed layered shape)
# menu:  universal layer, one entry per dish_id (snake_case key) with its components and portions.
# sites: per-site layer, reference photos per dish (paths RELATIVE to the photos root, /data/photos
#        in every container; the files enter the volume with docker compose cp).
# Component names are ASCII snake_case on purpose: they become the exact keys of the model's JSON
# answer. Editing this file + running `python -m scripts.seed_menu` inside the fastapi container is
# how the menu changes: no code changes, ever. menu_version stays 1 this era (bumping is FASE 3).
menu:
  tartine_aguacate:
    nombre: Tartine de aguacate
    componentes:
      - {nombre: pan_multigrano, porcion_g: 50}        # la rebanada de pan oscuro con semillas
      - {nombre: aguacate_preparado, porcion_g: 90}    # el untado de aguacate machacado (la cebolla morada va ADENTRO: cuenta aqui)
      - {nombre: jitomate_cherry, porcion_g: 20}       # las dos mitades de jitomate encima
      - {nombre: germinados, porcion_g: 3}             # los brotes verdes de adorno
  omelette_champinones:
    nombre: Omelette de champiñones
    componentes:
      - {nombre: omelette_huevo, porcion_g: 150}       # el omelette doblado (aprox. 3 huevos)
      - {nombre: relleno_champinones, porcion_g: 60}   # el relleno visible (champinones, pimiento y jitomate que asoman)
      - {nombre: ensalada_espinaca, porcion_g: 40}     # las hojas de espinaca con tiras de pimiento rojo
      - {nombre: pan_tostado, porcion_g: 60}           # las dos rebanadas de pan con semillas
sites:
  demo:
    fotos_ref:
      tartine_aguacate:
        - {path: reference/tartine_aguacate/1.jpg, condition: normal}
      omelette_champinones:
        - {path: reference/omelette_champinones/1.jpg, condition: normal}
