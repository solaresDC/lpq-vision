<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mostrador · LPQ_VISION</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .sitebar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  .sitebar label { margin: 0; }
  .sitebar select { width: auto; min-width: 240px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tabs a { text-decoration: none; padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--paper); }
  .tabs a.current { background: var(--brand); border-color: var(--brand); color: #fff; }
  .card h3 { font-size: 15px; margin: 18px 0 4px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 4px 0; }
</style>
</head>
<body>
<main class="wrap">
  <div class="sitebar" id="sitebar"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="section"></div>
</main>
<script type="module" src="/static/admin.js"></script>
</body>
</html>
