<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · LPQ_VISION</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .tile { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .tile .label { font-size: 13px; color: var(--muted); }
  tr.dish td { background: var(--bg); font-weight: 600; }
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h2>Filtros</h2>
    <div class="row" id="filters"></div>
  </section>
  <section class="card">
    <h2>Cola de análisis <span class="muted" id="queue-note"></span></h2>
    <div class="tiles" id="queue"></div>
  </section>
  <section class="card hidden" id="presentation-card">
    <h2>Emplatado (platos que salen)</h2>
    <div class="tiles" id="presentation"></div>
  </section>
  <section class="card">
    <h2>Merma por platillo y componente <span class="muted" id="dishes-note"></span></h2>
    <div id="dishes"></div>
  </section>
</main>
<script type="module">
import { api, session, requireLogin, mountHeader, poll, el, $, qs, fmtAgo, toast } from "/static/app.js";

let sess = await session();
if (!sess) sess = await requireLogin();
mountHeader("Panel", sess);

// --- filters (site only for admin; a site account is locked by the API anyway) ------------
const siteInput = el("input", { placeholder: "todos los sitios" });
const fromInput = el("input", { type: "date" });
const toInput = el("input", { type: "date" });
const applyBtn = el("button", { class: "primary", text: "Aplicar" });
if (!sess.admin) { siteInput.value = sess.site; siteInput.disabled = true; }
$("#filters").append(
  el("div", {}, el("label", { text: "Sitio" }), siteInput),
  el("div", {}, el("label", { text: "Desde" }), fromInput),
  el("div", {}, el("label", { text: "Hasta" }), toInput),
  el("div", {}, applyBtn),
);

function params() {
  return { site: sess.admin ? siteInput.value.trim() : "", date_from: fromInput.value, date_to: toInput.value };
}

// The presentation block shows when the selected site has the function on, or when graded rows exist.
let presentacionOn = false;
async function refreshFunction() {
  const site = params().site || (sess.site || "");
  if (!site) { presentacionOn = false; return; }
  try {
    const state = await api(`/api/camera/state?site=${encodeURIComponent(site)}`);
    presentacionOn = Boolean(state.funciones && state.funciones.presentacion);
  } catch { presentacionOn = false; }
}

// --- renderers ------------------------------------------------------------------------
function tile(label, value, extra) {
  return el("div", { class: "tile" }, el("div", { class: "label", text: label }), el("div", { class: "big", text: value }), extra ? el("div", { class: "muted", text: extra }) : null);
}

function renderQueue(qd) {
  const node = $("#queue");
  node.replaceChildren(
    tile("Pendientes", qd.pending),
    tile("En proceso", qd.working),
    tile("Listos (24 h)", qd.done_24h),
    tile("Fallidos (24 h)", qd.failed_24h),
    tile("Foto → resultado", qd.avg_upload_to_done_s_24h === null || qd.avg_upload_to_done_s_24h === undefined ? "—" : `${qd.avg_upload_to_done_s_24h} s`, "promedio 24 h"),
  );
  $("#queue-note").textContent = `actualizado ${new Date().toLocaleTimeString("es-MX")}`;
}

function renderPresentation(p) {
  const card = $("#presentation-card");
  const show = presentacionOn || (p.graded + p.flagged) > 0;
  card.classList.toggle("hidden", !show);
  if (!show) return;
  $("#presentation").replaceChildren(
    tile("Calificados", p.graded),
    tile("Promedio", p.avg_score === null ? "—" : `${p.avg_score}`, "parecido a la referencia, 0-100"),
    tile("Aprobados", p.pass_rate_pct === null ? "—" : `${p.pass_rate_pct} %`, "score de 80 o más"),
    tile("A revisar", p.flagged, "no parecían recién emplatados"),
  );
}

function renderDishes(dishes) {
  const node = $("#dishes");
  if (!dishes.length) {
    node.replaceChildren(el("p", { class: "muted", text: "Sin platos que regresaron en este rango." }));
    $("#dishes-note").textContent = "";
    return;
  }
  const table = el("table", {},
    el("thead", {}, el("tr", {},
      el("th", { text: "Platillo / componente" }),
      el("th", { class: "num", text: "% que queda (promedio)" }),
      el("th", { class: "num", text: "% de platos que lo regresan" }),
      el("th", { class: "num", text: "n" }),
    )),
  );
  const body = el("tbody");
  for (const d of dishes) {
    body.append(el("tr", { class: "dish" },
      el("td", { text: `${d.nombre} (${d.dish_id})` }),
      el("td", { class: "num", colspan: 2, text: `${d.plates} plato${d.plates === 1 ? "" : "s"}` }),
      el("td", { class: "num", text: "" }),
    ));
    for (const c of d.components) {
      body.append(el("tr", {},
        el("td", { text: `    ${c.component}` }),
        el("td", { class: "num", text: `${c.avg_left_pct} %` }),
        el("td", { class: "num", text: `${c.return_rate_pct} %` }),
        el("td", { class: "num", text: c.n }),
      ));
    }
  }
  table.append(body);
  node.replaceChildren(table);
  $("#dishes-note").textContent = `${dishes.length} platillo${dishes.length === 1 ? "" : "s"}`;
}

// --- the live loop: one call to /api/stats every 5 s while the tab is visible -----------
async function refresh() {
  const s = await api(`/api/stats${qs(params())}`);
  renderQueue(s.queue);
  renderPresentation(s.presentation);
  renderDishes(s.dishes);
}

applyBtn.addEventListener("click", async () => {
  applyBtn.disabled = true;
  try { await refreshFunction(); await refresh(); toast("Filtros aplicados", "ok"); }
  catch (err) { toast(err.message, "bad"); }
  finally { applyBtn.disabled = false; }
});

await refreshFunction();
poll(refresh);
</script>
</body>
</html>
