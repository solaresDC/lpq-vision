# LPQ_VISION - compose.universal.yaml
# The file for machines that run a LOCAL model in Docker (the 4 services + ollama).
# NOT used in Fase 1: no machine runs a local model in this era. Both the laptop and lpq-brain
# run compose.mac.yaml. This file exists so the sealed future needs zero redesign.
# Always run with -f:  docker compose -f compose.universal.yaml up -d
# No file named compose.yaml may ever exist: the bare command failing is typo-proofing, by design.

services:
  fastapi:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./config:/app/config
      - photos:/data/photos
      - logs:/data/logs
    ports:
      - "${BIND_IP:-127.0.0.1}:8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -m brain.worker.loop
    env_file: .env
    volumes:
      - ./config:/app/config
      - photos:/data/photos
      - logs:/data/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.15
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lpq}"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    volumes:
      - ./config:/app/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    # Sealed future block: a local vision model in Docker. Auto-pulls qwen3-vl:8b on first boot.
    image: ollama/ollama:0.34.4
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 4 && ollama pull qwen3-vl:8b && wait"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata: {}
  photos: {}
  logs: {}
  ollama: {}
